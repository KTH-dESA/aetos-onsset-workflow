# Exact export (conda env export --no-builds) of the environment used for the study, Windows 11. Orchestration: snakemake, otoole, GLPK, Gurobi.
# Snakemake calls the OnSSET env's python by path (config.yaml: onsset_python). On Linux/macOS some win-only packages (vc, ucrt, ...) must be dropped.
name: gep_workflow
channels:
  - bioconda
  - conda-forge
  - defaults
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - https://repo.anaconda.com/pkgs/msys2
